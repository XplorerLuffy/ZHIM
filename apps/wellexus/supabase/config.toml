# Supabase local development config — https://supabase.com/docs/guides/local-development
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[ingest]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "exp://localhost:8081"
additional_redirect_urls = ["exp://localhost:8081", "wellexus://"]
jwt_expiry = 3600
enable_signup = true
# Disable email confirmation for local dev
[auth.email]
enable_confirmations = false
double_confirm_changes = false

[functions]
# Edge functions are in supabase/functions/

[analytics]
enabled = false
